name: PR validation

# Run for every PR to main, including docs-only PRs, so required checks are
# always reported. Workflow path filters can leave required checks pending.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:native-config
      - run: npm run lint
      - run: npm run test:coverage -- --maxWorkers=4
      - run: npm run build
      - name: Verify the local native staging bundle
        env:
          ABBY_NATIVE_ENVIRONMENT: staging
          ABBY_NATIVE_API_ORIGIN: https://staging.example.invalid
        run: npm run build:native

  api-fixtures:
    name: API fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-contract-tests-not-for-production
      DEBUG: 'False'
      DATABASE_URL: 'sqlite:///:memory:'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare Django responses with shared fixtures
        run: |
          mkdir -p artifacts
          python manage.py test --settings=config.settings_test config.tests.test_api_contract_fixtures config.tests.test_greenlight_api_contract_fixtures config.tests.test_avatar_api_contract_fixtures config.tests.test_catalog_api_contract_fixtures --verbosity=2 2>&1 | tee artifacts/backend-api-fixtures.log
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test React consumption of shared fixtures
        working-directory: frontend
        run: npm run test:run -- src/api/sharedContractFixtures.test.js src/api/avatarContractFixtures.test.js src/api/catalogContractFixtures.test.js 2>&1 | tee ../artifacts/frontend-api-fixtures.log
      - name: Upload API fixture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-fixture-results
          path: artifacts/*-api-fixtures.log
          if-no-files-found: warn
          retention-days: 7
