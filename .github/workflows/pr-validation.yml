name: PR validation

# Run for every PR to main, including docs-only PRs, so required checks are
# always reported. Workflow path filters can leave required checks pending.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend-validation:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:native-config
      - run: npm run test:licensed-art
      - run: npm run test:asset-config
      - run: python3 -m unittest discover -s ../scripts/r3f -p test_woodland_texture_variant.py
      - run: npm run test:live-config
      - run: npm run lint
      - run: npm run test:coverage -- --maxWorkers=4
      - run: npm run build
      - name: Verify the local native staging bundle
        env:
          ABBY_NATIVE_ENVIRONMENT: staging
          ABBY_NATIVE_API_ORIGIN: https://staging.example.invalid
        run: npm run build:native

  backend-validation:
    name: Backend validation
    runs-on: ubuntu-latest
    # The 5,200-test hosted run exhausted 30m during real migration tests.
    # Include measured suite growth and setup headroom; see the validation runbook.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: summerforge_test
          POSTGRES_USER: summerforge
          POSTGRES_PASSWORD: summerforge
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U summerforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-backend-tests-not-for-production
      DEBUG: 'False'
      DATABASE_URL: postgres://summerforge:summerforge@localhost:5432/summerforge_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify synthetic private asset conversion guards
        run: python -m unittest discover -s scripts/r3f -p 'test_prepare_*.py' -v
      - name: Verify the isolated staging recipe and origin boundary
        run: |
          docker compose version
          python -m unittest discover -s scripts/operations -p 'test_staging_recipe.py' -v
      - name: Run migrations on PostgreSQL
        run: python manage.py migrate --noinput
      - name: Run the full backend suite
        run: python manage.py test --noinput --verbosity=2

  api-fixtures:
    name: API fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-contract-tests-not-for-production
      DEBUG: 'False'
      DATABASE_URL: 'sqlite:///:memory:'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare Django responses with shared fixtures
        run: |
          mkdir -p artifacts
          python manage.py test --settings=config.settings_test config.tests.test_api_contract_fixtures config.tests.test_greenlight_api_contract_fixtures config.tests.test_avatar_api_contract_fixtures config.tests.test_rpg_integrity_api_contract_fixtures config.tests.test_catalog_api_contract_fixtures config.tests.test_catalog_icon_api_contract_fixtures config.tests.test_elemental_art_api_contract_fixtures config.tests.test_hatchery_discovery_api_contract_fixtures config.tests.test_report_card_api_contract_fixtures config.tests.test_challenge_api_contract_fixtures config.tests.test_homework_ai_api_contract_fixtures config.tests.test_project_ai_api_contract_fixtures config.tests.test_drive_export_api_contract_fixtures config.tests.test_printing_api_contract_fixtures config.tests.test_material_api_contract_fixtures config.tests.test_reading_api_contract_fixtures config.tests.test_taxonomy_delete_api_contract_fixtures config.tests.test_taxonomy_retirement_api_contract_fixtures config.tests.test_template_api_contract_fixtures config.tests.test_lifecycle_api_contract_fixtures config.tests.test_parent_api_contract_fixtures config.tests.test_google_auth_api_contract_fixtures config.tests.test_progression_api_contract_fixtures config.tests.test_content_workbench_api_contract_fixtures config.tests.test_submission_timing_api_contract_fixtures config.tests.test_journal_api_contract_fixtures config.tests.test_lorebook_api_contract_fixtures config.tests.test_oauth_api_contract_fixtures config.tests.test_usage_api_contract_fixtures --verbosity=2 2>&1 | tee artifacts/backend-api-fixtures.log
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test React consumption of shared fixtures
        working-directory: frontend
        run: npm run test:run -- src/api/sharedContractFixtures.test.js src/api/avatarContractFixtures.test.js src/api/rpgIntegrityContractFixtures.test.jsx src/api/catalogContractFixtures.test.js src/api/reportCardContractFixtures.test.js src/api/challengeContractFixtures.test.js src/api/voyagerFeedbackContractFixtures.test.js src/api/homeworkAIContractFixtures.test.js src/api/projectAIContractFixtures.test.js src/api/googleDriveContracts.test.js src/api/printingContractFixtures.test.js src/api/materialContractFixtures.test.js src/api/readingContractFixtures.test.js src/api/taxonomyContractFixtures.test.jsx src/api/taxonomyRetirementContractFixtures.test.jsx src/api/templateContractFixtures.test.js src/api/accountLifecycleContractFixtures.test.js src/api/parentContractFixtures.test.jsx src/api/googleAuthContracts.test.js src/api/progressionLabContractFixtures.test.js src/api/contentWorkbenchContractFixtures.test.jsx src/api/submissionTimingContractFixtures.test.jsx src/api/journalContractFixtures.test.js src/api/lorebookContractFixtures.test.jsx src/pages/Manage.oauth.test.jsx src/api/usageContractFixtures.test.js 2>&1 | tee ../artifacts/frontend-api-fixtures.log
      - name: Upload API fixture results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-fixture-results
          path: artifacts/*-api-fixtures.log
          if-no-files-found: warn
          retention-days: 7
