name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer main commit supersedes pending/running validation for an older one.
# The deploy helper also checks main before queuing and while polling Coolify.
concurrency:
  group: production-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  current-main:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.guard.outputs.current }}
    steps:
      - name: Skip superseded commits and non-main dispatches
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setOutput('current', 'false');
              core.notice('Production deployment only runs from main.');
              return;
            }
            const { data } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main',
            });
            const current = data.object.sha === context.sha;
            core.setOutput('current', String(current));
            if (!current) core.notice('This commit has been superseded on main.');

  frontend-test:
    needs: current-main
    if: needs.current-main.outputs.current == 'true'
    runs-on: [self-hosted, deploy-platform]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage -- --maxWorkers=4

  backend-test:
    needs: current-main
    if: needs.current-main.outputs.current == 'true'
    runs-on: [self-hosted, deploy-platform]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: summerforge_test
          POSTGRES_USER: summerforge
          POSTGRES_PASSWORD: summerforge
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U summerforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      DATABASE_URL: postgres://summerforge:summerforge@localhost:5432/summerforge_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test --verbosity=2

  build:
    needs: [frontend-test, backend-test]
    runs-on: [self-hosted, deploy-platform]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/abby-docker-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-build"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Django image
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ steps.tag.outputs.tag }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --build-arg VITE_SENTRY_DSN \
            --build-arg VITE_SENTRY_ENVIRONMENT \
            --build-arg VITE_SENTRY_RELEASE \
            --secret id=SENTRY_AUTH_TOKEN,env=SENTRY_AUTH_TOKEN \
            --build-arg SENTRY_ORG \
            --build-arg SENTRY_PROJECT \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f Dockerfile .

      - name: Push images
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Remove this job's registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          docker logout "$REGISTRY" || true
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG" 2>/dev/null || true

  scan:
    needs: build
    runs-on: [self-hosted, deploy-platform]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR for scanning
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/abby-docker-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-scan"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      - name: Trivy scan
        run: |
          trivy image --severity "CRITICAL,HIGH" --ignore-unfixed --exit-code 1 --format table \
            --ignorefile .trivyignore \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
      - name: Remove this job's registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          docker logout "$REGISTRY" || true
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG" 2>/dev/null || true

  deploy:
    needs: [build, scan]
    runs-on: [self-hosted, deploy-platform]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployment guards
        run: python -m unittest discover -s scripts/operations -p 'test_deploy_coolify.py'
      - name: Deploy current main through Coolify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_HEALTH_URL: https://abby.bos.lol/health
        run: python scripts/operations/deploy_coolify.py
