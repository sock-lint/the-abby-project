name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      unity_build_only:
        description: Build and validate a Unity release on this branch without deployment
        type: boolean
        default: false

permissions:
  contents: read

# A newer main commit supersedes pending/running validation for an older one.
# The deploy helper also checks main before queuing and while polling Coolify.
concurrency:
  group: ${{ inputs.unity_build_only && 'unity-build-only' || 'production' }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  current-main:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.guard.outputs.current }}
    steps:
      - name: Skip superseded commits and non-main dispatches
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch' && String(context.payload.inputs?.unity_build_only) === 'true') {
              core.setOutput('current', 'false');
              core.notice('Build-only validation does not deploy either client.');
              return;
            }
            if (context.ref !== 'refs/heads/main') {
              core.setOutput('current', 'false');
              core.notice('Production deployment only runs from main.');
              return;
            }
            const { data } = await github.rest.git.getRef({
              ...context.repo, ref: 'heads/main',
            });
            const current = data.object.sha === context.sha;
            core.setOutput('current', String(current));
            if (!current) core.notice('This commit has been superseded on main.');

  frontend-test:
    needs: current-main
    if: needs.current-main.outputs.current == 'true'
    runs-on: [self-hosted, deploy-platform]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage -- --maxWorkers=4

  backend-test:
    needs: current-main
    if: needs.current-main.outputs.current == 'true'
    runs-on: [self-hosted, deploy-platform]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: summerforge_test
          POSTGRES_USER: summerforge
          POSTGRES_PASSWORD: summerforge
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U summerforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "False"
      DATABASE_URL: postgres://summerforge:summerforge@localhost:5432/summerforge_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python manage.py test --verbosity=2

  build:
    needs: [frontend-test, backend-test]
    runs-on: [self-hosted, deploy-platform]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/abby-docker-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-build"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build Django image
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ steps.tag.outputs.tag }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --build-arg VITE_SENTRY_DSN \
            --build-arg VITE_SENTRY_ENVIRONMENT \
            --build-arg VITE_SENTRY_RELEASE \
            --build-arg SENTRY_AUTH_TOKEN \
            --build-arg SENTRY_ORG \
            --build-arg SENTRY_PROJECT \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f Dockerfile .

      - name: Push images
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: Remove this job's registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          docker logout "$REGISTRY" || true
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG" 2>/dev/null || true

  scan:
    needs: build
    runs-on: [self-hosted, deploy-platform]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR for scanning
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/abby-docker-auth-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-scan"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      - name: Trivy scan
        run: |
          trivy image --severity "CRITICAL,HIGH" --ignore-unfixed --exit-code 1 --format table \
            --ignorefile .trivyignore \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}
      - name: Remove this job's registry credentials
        if: always() && env.DOCKER_CONFIG != ''
        run: |
          docker logout "$REGISTRY" || true
          rm -f "$DOCKER_CONFIG/config.json"
          rmdir "$DOCKER_CONFIG" 2>/dev/null || true

  deploy:
    needs: [build, scan]
    runs-on: [self-hosted, deploy-platform]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deployment guards
        run: python -m unittest discover -s scripts/operations -p 'test_deploy_coolify.py'
      - name: Deploy current main through Coolify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_HEALTH_URL: https://abby.bos.lol/health
        run: python scripts/operations/deploy_coolify.py

  unity-web-build:
    name: Build licensed Unity Web player
    needs: current-main
    if: >-
      ${{ needs.current-main.outputs.current == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.unity_build_only) }}
    runs-on: [self-hosted, Linux, X64, unity-6000.6.5f1]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require configured release inputs
        env:
          RELEASE_ENABLED: ${{ vars.UNITY_WEB_RELEASE_ENABLED }}
          PRIVATE_ASSET_ROOT: ${{ vars.UNITY_WEB_PRIVATE_ASSET_ROOT }}
        run: |
          test "$RELEASE_ENABLED" = true || { echo '::error::Unity Web release runner is not configured. See docs/operations/unity-web-release.md.'; exit 1; }
          test -n "$PRIVATE_ASSET_ROOT" || { echo '::error::UNITY_WEB_PRIVATE_ASSET_ROOT is required.'; exit 1; }
      - name: Test release packaging and deployment guards
        run: python3 -m unittest discover -s scripts/unity -p 'test_*release.py'
      - name: Export a fresh licensed player without rebuilding scenes
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
          UNITY_WEB_PRIVATE_ASSET_ROOT: ${{ vars.UNITY_WEB_PRIVATE_ASSET_ROOT }}
          UNITY_WEB_SOURCE_SHA: ${{ github.sha }}
        run: |
          export UNITY_WEB_RELEASE_DIR="$RUNNER_TEMP/abby-unity-web-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "UNITY_WEB_RELEASE_DIR=$UNITY_WEB_RELEASE_DIR" >> "$GITHUB_ENV"
          bash scripts/unity/Build-Web.sh
      - name: Transfer only the compiled player and release manifest
        uses: actions/upload-artifact@v4
        with:
          name: unity-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.UNITY_WEB_RELEASE_DIR }}/package/web.tar.gz
            ${{ env.UNITY_WEB_RELEASE_DIR }}/package/release.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload editor build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-web-build-log
          path: ${{ env.UNITY_WEB_RELEASE_DIR }}/build-web.log
          if-no-files-found: warn
          retention-days: 7

  unity-web-verify:
    name: Verify Unity Web image without deployment
    needs: unity-web-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.unity_build_only }}
    runs-on: [self-hosted, Linux, X64, deploy-platform]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unity-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abby-unity-verify-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify compiled artifact, HTTP hosting, scan, and image archive
        run: |
          python3 scripts/unity/deploy_web_release.py \
            --artifact-dir "$RUNNER_TEMP/abby-unity-verify-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --verify-only
      - name: Remove this job's disposable verification image
        if: always()
        run: |
          set -euo pipefail
          unity_release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          unity_image="abby-unity-web:ci-$unity_release"
          if ! docker image inspect "$unity_image" >/dev/null 2>&1; then
            exit 0
          fi
          unity_label="$(docker image inspect --format '{{ index .Config.Labels "io.abby.unity.release" }}' "$unity_image")"
          test "$unity_label" = "$unity_release" || { echo '::error::Verification image ownership did not match; retained.'; exit 1; }
          docker image rm --no-prune "$unity_image"

  unity-web-deploy:
    name: Deploy and verify Unity Web
    needs: [unity-web-build, deploy]
    if: ${{ !inputs.unity_build_only }}
    environment:
      name: unity-production
      url: https://abby.bos.lol/play/
    runs-on: [self-hosted, Linux, X64, deploy-platform]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unity-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/abby-unity-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Create this job's restricted SSH credential
        env:
          UNITY_SSH_KEY: ${{ secrets.UNITY_WEB_DEPLOY_SSH_KEY }}
          UNITY_KNOWN_HOSTS: ${{ vars.UNITY_WEB_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$UNITY_SSH_KEY" && test -n "$UNITY_KNOWN_HOSTS"
          umask 077
          unity_ssh_dir="$RUNNER_TEMP/abby-unity-ssh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$unity_ssh_dir"
          printf '%s\n' "$UNITY_SSH_KEY" > "$unity_ssh_dir/key"
          printf '%s\n' "$UNITY_KNOWN_HOSTS" > "$unity_ssh_dir/known_hosts"
          echo "UNITY_WEB_SSH_KEY_PATH=$unity_ssh_dir/key" >> "$GITHUB_ENV"
          echo "UNITY_WEB_SSH_KNOWN_HOSTS_PATH=$unity_ssh_dir/known_hosts" >> "$GITHUB_ENV"
      - name: Validate, scan, deploy current main, and verify public release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNITY_WEB_SSH_TARGET: ${{ vars.UNITY_WEB_SSH_TARGET }}
        run: |
          python3 scripts/unity/deploy_web_release.py \
            --artifact-dir "$RUNNER_TEMP/abby-unity-artifact-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Remove this job's SSH credential
        if: always() && env.UNITY_WEB_SSH_KEY_PATH != ''
        run: |
          rm -f "$UNITY_WEB_SSH_KEY_PATH" "$UNITY_WEB_SSH_KNOWN_HOSTS_PATH"
          rmdir "$(dirname "$UNITY_WEB_SSH_KEY_PATH")"
