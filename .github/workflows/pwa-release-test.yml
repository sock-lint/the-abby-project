name: PWA release and offline verification

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/pwa-release-test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/pwa-release-test.yml'
  workflow_dispatch:

jobs:
  pwa-release-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Configure Ubuntu package downloads
        run: |
          # Hosted Azure mirrors can keep transferring packages at a few kB/s.
          # Preserve suites, components and signing configuration; change only
          # the Ubuntu archive endpoint, including runner mirror-list files.
          sudo python3 - <<'PY'
          from pathlib import Path

          paths = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in paths:
              if not path.is_file():
                  continue
              original = path.read_text()
              updated = original.replace('http://azure.archive.ubuntu.com/ubuntu',
                                         'https://archive.ubuntu.com/ubuntu')
              updated = updated.replace('https://azure.archive.ubuntu.com/ubuntu',
                                        'https://archive.ubuntu.com/ubuntu')
              if updated != original:
                  path.write_text(updated)
                  print(f'Updated Ubuntu archive endpoint in {path}')
          Path('/etc/apt/apt.conf.d/80-pwa-downloads').write_text(
              'Acquire::Retries "2";\n'
              'Acquire::http::Timeout "30";\n'
              'Acquire::https::Timeout "30";\n'
          )
          PY
      - name: Install browser system dependencies
        timeout-minutes: 10
        working-directory: frontend
        run: npx playwright install-deps chromium webkit
      - name: Install browsers
        timeout-minutes: 10
        working-directory: frontend
        run: |
          npx playwright install chromium webkit
      - name: Verify private portrait build loader
        working-directory: frontend
        run: npm run test:licensed-art
      - name: Verify release replacement and offline behavior
        working-directory: frontend
        run: npm run test:pwa
      - name: Save browser failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-browser-failure
          path: frontend/test-results/
          retention-days: 7
