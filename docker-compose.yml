# Shared env blocks merged into each application service via YAML anchors.
# x-app-env covers SECRET_KEY/DEBUG/DB/Redis/Celery/Sentry — every app
# service needs these. x-app-storage adds AWS-S3 + Google OAuth + the
# Anthropic key — needed by django + celery_worker but not celery_beat.
# Adding a new common env var here propagates to every service that
# merges the anchor; without this, the same key has to be added 3×.
x-app-env: &app-env
  # Audit C4: no SECRET_KEY default. The ``${SECRET_KEY:?...}`` form makes
  # compose refuse to start if the env var isn't set, which is much safer
  # than silently booting with a hardcoded "insecure" key.
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in your environment / .env file}
  DEBUG: ${DEBUG:-False}
  DATABASE_URL: ${DATABASE_URL:-postgres://summerforge:changeme@db:5432/summerforge}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  # Email (audit H11) — passed through; Django defaults to SMTP backend
  # when DEBUG=False and falls back to console only in dev.
  EMAIL_BACKEND: ${EMAIL_BACKEND:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@summerforge.local}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}

x-app-storage: &app-storage
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  USE_S3_STORAGE: ${USE_S3_STORAGE:-false}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
  AWS_QUERYSTRING_EXPIRE: ${AWS_QUERYSTRING_EXPIRE:-3600}

services:
  # Infrastructure — long-lived
  db:
    image: postgres:16-alpine
    # max_connections bumped from default 100 → 200 to give 2x headroom for
    # transient deploy overlap (old container holds connections during
    # graceful shutdown while new container starts opening its own).
    # shared_buffers scaled in lock-step per Postgres tuning guidance.
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-summerforge}
      POSTGRES_USER: ${POSTGRES_USER:-summerforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-summerforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    expose:
      - "5432"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    expose:
      - "6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Application — rebuilt on deploy.
  # Serves the Django REST API, the built React SPA, AND the MCP
  # Streamable HTTP endpoint at /mcp — all on the same origin (:8000).
  # MCP is mounted inside ``config.asgi`` so there's no separate process
  # and no reverse-proxy changes are needed.
  #
  # Routing note for Traefik/Coolify:
  #   The Coolify-auto-generated router for this service (Host rule on the
  #   public FQDN, e.g. ``abby.bos.lol``) already forwards ``/mcp`` and
  #   ``/mcp/...`` to this container unmodified. DO NOT:
  #     * add a separate ``mcp`` service to this file — there is no second
  #       process serving MCP,
  #     * add a ``stripprefix`` middleware that removes ``/mcp`` — the ASGI
  #       dispatcher in ``config/asgi.py`` checks for the literal ``/mcp``
  #       prefix, and FastMCP's internal router also expects it intact.
  #       Stripping it turns every MCP request into a SPA catch-all HTML
  #       response.
  #   If a custom Traefik dynamic-config file for ``/mcp`` exists on the
  #   production host (e.g. ``/data/coolify/proxy/dynamic/abby-mcp.yaml``),
  #   it is a leftover from an earlier architecture and should be removed;
  #   it hard-codes the container name, which Coolify regenerates on every
  #   deploy.
  django:
    image: ${IMAGE_TAG:-the-abby-project}
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python manage.py backfill_accounts_history && python manage.py migrate --noinput && python manage.py loadrpgcontent && gunicorn config.asgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class uvicorn.workers.UvicornWorker --timeout 120"
    volumes:
      # LLM-authored RPG content packs. The MCP ``write_pack_file`` tool
      # writes into this path; binding it to the repo on the host so
      # pack YAMLs survive container rebuilds AND are available for the
      # operator to git-commit if they want to promote a pack. The
      # initial/ directory stays baked into the image (NOT mounted) so
      # runtime writes can never clobber base content — MCP also blocks
      # writes to ``initial`` at the tool level as defense in depth.
      - ./content/rpg/packs:/app/content/rpg/packs
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      <<: [*app-env, *app-storage]
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      PARENT_PASSWORD: ${PARENT_PASSWORD:-}
      CHILD_PASSWORD: ${CHILD_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    # Memory caps: defense against a runaway worker, not a perf budget.
    # Coolify can override these per-deploy. 1G covers the steady-state
    # 3-gunicorn-worker process tree with ~150MB headroom for Sentry +
    # connection pools + occasional ingestion-pipeline allocs (PDF parse,
    # crawl4ai). Bump to 1.5G if a dashboard endpoint OOMs under load.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  celery_worker:
    image: ${IMAGE_TAG:-the-abby-project}
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l info --concurrency 4
    env_file:
      - .env
    environment:
      <<: [*app-env, *app-storage]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # 768M for 4 worker processes — each worker holds Django + a chunk of
    # the in-memory image-processing path (sprite generation can burst
    # to ~150MB during chroma-key + frame extraction).
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  celery_beat:
    image: ${IMAGE_TAG:-the-abby-project}
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `pgrep` does not exist in this image. The runtime stage is
    # python:3.12-slim, which omits `procps`, and nothing in the Dockerfile's
    # apt line pulls it back in — so `pgrep -f 'celery.*beat'` exited 127 and
    # this container reported unhealthy for its entire life.
    #
    # Read PID 1 directly instead. There is no ENTRYPOINT in the Dockerfile,
    # so compose's `command` is exec'd as PID 1 — beat itself.
    #
    # Do NOT "improve" this into a scan over all of /proc. The healthcheck's
    # own argv, and its `sh -c` wrapper's, both contain the literal string
    # "beat", so a scan matches itself and reports healthy with no beat
    # running at all — failing open, which is worse than the bug it replaces.
    #
    # Scope: a liveness floor, not a tick check. It catches a PID 1 that is
    # not beat; it cannot see a scheduler whose loop has wedged. A real tick
    # heartbeat needs app code — stamp a file from a beat signal, the way
    # printer_listener does — which is out of scope for a compose-only fix.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; c=open(\"/proc/1/cmdline\",\"rb\").read(); sys.exit(0 if b\"celery\" in c and b\"beat\" in c else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # 192M is plenty — celery_beat is a single scheduler process that
    # only enqueues jobs. The Django + DjangoCeleryBeat scheduler bring
    # the floor up to ~120M.
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # The ONE process allowed to open an MQTT connection to a printer.
  #
  # The X1's embedded broker accepts roughly four simultaneous clients, and
  # Bambu Studio, Handy and Home Assistant each hold one. If django or
  # celery_worker connected per-worker we would blow the ceiling and the
  # broker would start silently dropping clients — us and Home Assistant
  # kicking each other off in a loop. So the connection lives here and
  # nowhere else; everything else reads printer state through the fan-out in
  # apps/printing/fanout.py.
  #
  # DO NOT scale this service past 1 replica. A Redis advisory lock makes a
  # second replica skip each printer rather than fight for it, but the whole
  # point is that there is one.
  printer_listener:
    image: ${IMAGE_TAG:-the-abby-project}
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py run_printer_listener
    env_file:
      - .env
    environment:
      <<: *app-env
      PRINT_BAMBU_CA_CERT: ${PRINT_BAMBU_CA_CERT:-}
      PRINT_BAMBU_CLOUD_HOST: ${PRINT_BAMBU_CLOUD_HOST:-us.mqtt.bambulab.com}
      PRINT_BAMBU_CLOUD_PORT: ${PRINT_BAMBU_CLOUD_PORT:-8883}
      PRINT_FANOUT_MQTT_URL: ${PRINT_FANOUT_MQTT_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Heartbeat, not pgrep. The runtime image is python:3.12-slim, which has
    # no `procps` — `pgrep` exits 127 there and the container would be
    # unhealthy forever. (celery_beat had the same defect; it is fixed above,
    # with a PID 1 read rather than a heartbeat, because beat has no tick to
    # stamp without app code.) A heartbeat is the better probe regardless: it
    # catches a supervisor whose loop has wedged, which process-existence
    # cannot. The supervisor stamps the file once per pass, including while
    # it is waiting out a migration — waiting is alive.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys,time; p='/tmp/printer-listener.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Measured: 96 MB RSS idle with zero printers. Django, DRF and the app
    # registry dominate that; the supervisor itself is nearly free. Each
    # printer then adds one paho network thread, a bounded queue and a small
    # state dict.
    #
    # The previous 256M/96M put the reservation exactly ON measured idle with
    # ~2.6x headroom to the limit — too tight once Sentry, psycopg pools and
    # a few printers are in. Note compose DOES enforce
    # `deploy.resources.limits.memory` outside Swarm, unlike `replicas`
    # below, which it ignores. An OOM kill here is not a free restart: it
    # drops the MQTT connection, and if that lands mid-print the FINISH
    # transition is missed and the job only closes hours later via
    # reconcile_stale_jobs, as `unknown`, with the budget debited as a
    # partial failure. 4x measured idle is cheap insurance against that.
    #
    # NOTE: `replicas` is declarative here — plain `docker compose up` ignores
    # it outside Swarm, so it records intent rather than enforcing it, and
    # `--scale printer_listener=2` would cheerfully start a second one. The
    # thing that actually keeps the connection count at one is the Redis
    # advisory lock in apps/printing/listener.py::PrinterLock, which makes the
    # loser skip each printer instead of fighting for it.
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
