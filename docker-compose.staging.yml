# A separate Coolify application must use this file, never the production stack.
# Coolify gives each application its own Compose project/network/volume names.
# No host paths, production env_file, printer listener, scheduler or mail keys.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abby_staging
      POSTGRES_USER: abby_staging
      POSTGRES_PASSWORD: ${STAGING_DATABASE_PASSWORD:?Set a unique staging database password}
    volumes:
      - staging_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U abby_staging -d abby_staging"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  django:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py loadrpgcontent &&
      gunicorn config.asgi:application --bind 0.0.0.0:8000
      --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120"
    environment:
      ABBY_STAGING: "true"
      SECRET_KEY: ${STAGING_SECRET_KEY:?Set a unique staging signing key}
      DEBUG: "false"
      DATABASE_URL: postgresql://abby_staging:${STAGING_DATABASE_PASSWORD:?Set a unique staging database password}@db:5432/abby_staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      # Only avatar/API journeys run here; there are no background consumers.
      CELERY_TASK_ALWAYS_EAGER: "false"
      ALLOWED_HOSTS: ${STAGING_HOSTNAME:?Set the staging hostname},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: ${STAGING_ORIGIN:?Set the staging origin}
      CORS_ALLOWED_ORIGINS: capacitor://localhost,https://localhost
      ALLOW_PARENT_SIGNUP: "false"
      EMAIL_BACKEND: django.core.mail.backends.dummy.EmailBackend
      USE_S3_STORAGE: "false"
      SENTRY_DSN: ""
      SENTRY_ENVIRONMENT: staging
      MCP_PUBLIC_BASE_URL: ${STAGING_ORIGIN:?Set the staging origin}/mcp
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/health]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    restart: unless-stopped

volumes:
  staging_postgres:
