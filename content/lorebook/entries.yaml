entries:
  - slug: duties
    title: Chores
    icon: "🧹"
    audience_title: "Household tasks"
    chapter: daily_life
    summary: "Recurring chores with parent approval and clear rewards."
    kid_voice: |
      Chores help everyone take care of the home, from washing dishes and
      doing laundry to caring for pets. Submit a completed chore for a parent
      to review.
    mechanics:
      - "A child submits a completed chore; a parent approves or rejects it."
      - "Approved chores can pay money, Coins, XP through skill tags, streak credit, drops, and challenge progress."
      - "Daily and weekly chores use one active completion per day/week; rejected completions do not block a retry."
      - "Alternating-week schedules support shared custody without pre-generating task instances."
    parent_knobs:
      settings: []
      powers_badges:
        - chore_completions
      content_sources:
        - "Parents set each chore's reward_amount, coin_reward, xp_reward, recurrence, schedule, and skill tags."
    economy:
      money: true
      coins: true
      xp: true
      drops: true
      quest_progress: true
      streak_credit: true
    trial_template: tap_and_reward
    trial:
      prompt: "Tap the dish to wash it."
      payoff: "+1 coin · +5 XP"
      target_icon: "🍽️"
      reward_icon: "🪙"

  - slug: rituals
    title: Habits
    icon: "🌿"
    audience_title: "Everyday practice"
    chapter: daily_life
    summary: "Habits are quick taps for practice, not paid work."
    kid_voice: |
      Habits help you practice something regularly. Log a positive action to
      build strength. You can also record a setback without losing money
      or coins.
    mechanics:
      - "Positive habit taps grant XP through habit skill tags, streak credit, drops, and challenge progress."
      - "Habits never pay money or Coins directly."
      - "Positive taps are capped per local day by max_taps_per_day; negative taps stay uncapped."
      - "Habit strength moves toward zero overnight when a habit is not logged."
    parent_knobs:
      settings: []
      powers_badges:
        - habit_max_strength
        - habit_count_at_strength
        - habit_taps_lifetime
      content_sources:
        - "Parents can tune max taps per day, XP reward, and skill tags."
    economy:
      money: false
      coins: false
      xp: true
      drops: true
      quest_progress: true
      streak_credit: true
    trial_template: tap_and_reward
    trial:
      prompt: "Tap to log your reading habit."
      payoff: "+5 XP · habit strength increases"
      target_icon: "📖"
      reward_icon: "🌿"

  - slug: study
    title: Homework
    icon: "📚"
    audience_title: "School assignments"
    chapter: daily_life
    summary: "Track school assignments and earn skill XP when approved."
    kid_voice: |
      Add your school assignments, plan the steps, and submit your finished
      work. Approved homework earns skill XP. It does not pay money or coins.
    mechanics:
      - "Homework pays no money and no Coins."
      - "Approved submissions award XP through homework skill tags and can count for drops, streak credit, and challenge progress."
      - "Timeliness labels are recorded on submission; early/on-time work can satisfy on_time challenge filters and badge criteria."
      - "The first homework create per child per local day can count for game-loop progress; create-delete-create cannot farm it."
      - "Children can self-plan AI breakdowns only when the due date is far enough out; parents can always plan."
    parent_knobs:
      settings:
        - key: HOMEWORK_LATE_CUTOFF_DAYS
          label: Late cutoff window
          value: 3
        - key: HOMEWORK_SELF_PLAN_LEAD_DAYS
          label: Child self-plan lead days
          value: 3
      powers_badges:
        - homework_planned_ahead
        - homework_on_time_count
      content_sources:
        - "Assignments and templates author subject, effort level, due date, and fixed XP skill tags."
    economy:
      money: false
      coins: false
      xp: true
      drops: true
      quest_progress: true
      streak_credit: true
    trial_template: tap_and_reward
    trial:
      prompt: "Tap to submit your math sheet."
      payoff: "+10 XP · timeliness logged"
      target_icon: "📝"
      reward_icon: "📚"

  - slug: journal
    title: Journal
    icon: "🪶"
    audience_title: "Your daily journal"
    chapter: daily_life
    summary: "One private reflection per day, with writing XP."
    kid_voice: |
      Write what mattered today: something you did, a worry, a funny moment,
      or anything you want to remember. Keep it private or choose to share
      it with your family.
    mechanics:
      - "Each child may write one journal entry per local day; the database enforces one-per-day."
      - "The first saved entry can earn writing XP from a 15 XP pool split toward Creative Writing and Vocabulary, and counts for streaks, drops, and challenges. The save confirmation shows any verified XP award."
      - "Children can edit entry text on the day it was written. After midnight, the text is read-only, but its sharing setting can still be changed."
      - "New journal entries default to Only you. Parents can read only entries the child shares with the family."
    parent_knobs:
      settings: []
      powers_badges:
        - journal_entries_written
        - journal_streak_days
      content_sources:
        - "The XP split is hardcoded to Creative Writing and Vocabulary."
    economy:
      money: false
      coins: false
      xp: true
      drops: true
      quest_progress: true
      streak_credit: true
    trial_template: scribe
    trial:
      prompt: "Write what mattered today."
      payoff: "+15 XP across Creative Writing & Vocabulary"
      placeholder: "Today I…"
      min_length: 8

  - slug: creations
    title: Creations
    icon: "🎨"
    audience_title: "Things you made"
    chapter: daily_life
    summary: "Photos of things made, with a two-per-day XP gate."
    kid_voice: |
      Save things you make with a photo, a caption, or an audio recording.
      Choose the creative skills you used, and submit a creation for a
      parent to review for bonus XP.
    mechanics:
      - "The first 2 Creations per child per local day grant the 10 XP baseline pool, drop chance, streak credit, and challenge progress."
      - "The 3rd and later Creations still appear in Gallery and Timeline but do not grant baseline XP that day."
      - "The daily counter survives deletion, so create-delete-create cannot re-arm the XP window."
      - "A child can submit a Creation for parent bonus; approval grants a separate bonus XP pool, defaulting to 15 XP."
      - "Baseline XP goes to child-picked creative skills; parent bonus XP can use parent-authored bonus tags."
    parent_knobs:
      settings: []
      powers_badges:
        - creations_logged
        - creations_approved
        - creation_skill_breadth
      content_sources:
        - "Creative skill choices come from the creative allow-list; bonus tags are stored per Creation."
    economy:
      money: false
      coins: false
      xp: true
      drops: true
      quest_progress: true
      streak_credit: true
    trial_template: tap_and_reward
    trial:
      prompt: "Tap to log the doodle you just made."
      payoff: "+10 XP · a new Gallery item"
      target_icon: "🖼️"
      reward_icon: "🎨"

  - slug: ventures
    title: Projects
    icon: "🛠️"
    audience_title: "Project work"
    chapter: long_work
    summary: "Projects, clock time, milestones, optional cash rewards, and materials."
    kid_voice: |
      Projects help you plan and track things you want to build, repair,
      cook, code, or learn. Follow the steps, log your work time, and
      complete milestones along the way.
    mechanics:
      - "Clocking out distributes 10 XP per hour across project skill tags and awards Coins per tracked hour."
      - "Projects can be required allowance work or optional projects with a cash reward; completion posts the matching payment ledger entry."
      - "Milestones are parent-set checkpoints; completing one can pay milestone money and fixed skill XP."
      - "Steps are instructional tasks only — checking them off never pays money, Coins, or XP by itself."
      - "Quiet hours, max-entry length, auto-clock-out, and one-active-entry constraints protect time tracking."
    parent_knobs:
      settings:
        - key: COINS_PER_HOUR
          label: Coins per tracked hour
          value: 5
      powers_badges:
        - hours_worked
        - first_clock_in
        - projects_completed
        - milestones_completed
        - bounty_completed
        - perfect_timecard
      content_sources:
        - "Project and milestone skill tags author XP distribution."
        - "Project payment_kind controls required allowance work vs optional cash rewards."
    economy:
      money: true
      coins: true
      xp: true
      drops: true
      quest_progress: true
      streak_credit: true
    trial_template: observe
    trial:
      prompt: "Watch project progress update as you log work."
      payoff: "+10 XP/hr distributed across the project's skill tags"
      caption: "Hours in. Milestones close. Coins arrive at clock-out."

  - slug: skills
    title: Skills
    icon: "🌳"
    audience_title: "Your skill progress"
    chapter: long_work
    summary: "XP flows into a Category → Subject → Skill tree."
    kid_voice: |
      Skills show what you are learning. Practice earns XP in the skills
      linked to each activity. Gain levels and meet requirements to unlock
      more skills.
    mechanics:
      - "Skill XP comes from tagged projects, milestones, homework, chores, habits, challenges, journal entries, and creations."
      - "Weighted tags split a pool proportionally; homework/milestone tags use fixed XP amounts."
      - "Level thresholds are shared across skills and unlock richer mastery visuals."
      - "Locked skills can require prerequisites before they count toward some mastery badges."
    parent_knobs:
      settings: []
      powers_badges:
        - skill_level_reached
        - skills_unlocked
        - skill_categories_breadth
        - subjects_completed
        - cross_category_unlock
        - category_mastery
      content_sources:
        - "The skill tree is YAML-authored in content/rpg/initial/skill_tree.yaml."
    economy:
      money: false
      coins: false
      xp: true
      drops: false
      quest_progress: false
      streak_credit: false
    trial_template: observe
    trial:
      prompt: "Watch Woodworking progress increase as XP is earned."
      payoff: "Gain a level at the next XP threshold"
      caption: "Tagged practice fills the right skill. Levels are shared across the tree."

  - slug: badges
    title: Badges
    icon: "🏅"
    audience_title: "Your achievements"
    chapter: long_work
    summary: "Milestone recognitions that can award XP and Coins."
    kid_voice: |
      Badges recognize your achievements, from a first project to a lasting
      habit. Select a badge to see what you need to do to earn it.
    mechanics:
      - "Badge criteria are evaluated across time, projects, skills, economy, homework, creations, RPG progress, and saved milestones."
      - "Earning a badge can grant an XP bonus and rarity-scaled Coins."
      - "Some challenge-completion badges opt out of extra Coins when the challenge already paid its reward."
      - "The badge catalog is view-only for children and parent-managed from the Skills admin surface."
    parent_knobs:
      settings:
        - key: COINS_PER_BADGE_RARITY
          label: Rarity coin bonuses
          value: "common 5 → legendary 150"
      powers_badges:
        - badges_earned_count
      content_sources:
        - "Badges are YAML-authored in content/rpg/initial/badges.yaml and pack files."
    economy:
      money: false
      coins: true
      xp: true
      drops: true
      quest_progress: true
      streak_credit: false
    trial_template: observe
    trial:
      prompt: "Watch a badge appear after its requirement is met."
      payoff: "Badge + coins based on rarity"
      caption: "Earned badges stay in your collection."

  - slug: chronicle
    title: Memories
    icon: "📜"
    audience_title: "Your memory timeline"
    chapter: long_work
    summary: "A timeline of birthdays, milestones, journal entries, and memories."
    kid_voice: |
      Memories brings together your journal, photos, grades, and timeline.
      Browse milestones, birthdays, and things you made, organized by year.
    mechanics:
      - "Timeline years start in August and continue after high school with age-based labels."
      - "Birthday checks grant Coins based on age and can show a celebration modal."
      - "Journal and Creation entries flow into the same timeline with their own privacy/visibility rules."
      - "Parent-authored manual memories never replace child-authored journal pages."
    parent_knobs:
      settings:
        - key: BIRTHDAY_COINS_PER_YEAR
          label: Birthday coin gift per age year
          value: 100
      powers_badges:
        - chronicle_milestones_logged
        - grade_reached
        - birthdays_logged
      content_sources:
        - "Chronicle entries are written by service hooks and scheduled Celery tasks."
    economy:
      money: false
      coins: true
      xp: false
      drops: false
      quest_progress: false
      streak_credit: false
    trial_template: observe
    trial:
      prompt: "Browse the timeline from earlier years to today."
      payoff: "New memories appear on the timeline."
      caption: "Birthdays, year starts, firsts, milestones, recaps, journals, and creations."

  - slug: quests
    title: Challenges
    icon: "⚔️"
    audience_title: "Boss and collection challenges"
    chapter: rpg_layer
    summary: "Boss and collection challenges that progress through everyday activities."
    kid_voice: |
      Challenges give you a goal to work toward through everyday activities.
      Complete matching chores, project work, habits, or homework to damage
      a boss or add to a collection.
    mechanics:
      - "A user has one active regular challenge at a time."
      - "Boss challenges use trigger damage; collection challenges count matching trigger events."
      - "Trigger filters can restrict challenges to certain triggers, projects, chores, skill categories, or on-time homework."
      - "Boss rage adds extra shield on idle days and decays when the child returns to activity."
      - "Completing a challenge can award Coins, XP through challenge skill tags, and item rewards."
    parent_knobs:
      settings: []
      powers_badges:
        - quest_completed
        - boss_quests_completed
        - collection_quests_completed
      content_sources:
        - "Challenge definitions and reward items are YAML-authored in content/rpg/initial/quests.yaml and packs."
    economy:
      money: false
      coins: true
      xp: true
      drops: true
      quest_progress: true
      streak_credit: false
    trial_template: choice
    trial:
      prompt: "Choose a challenge to try."
      payoff: "Challenge begins · progress tracks matching activities"
      choices:
        - label: "Boss · Dragon"
          icon: "🐉"
          outcome: "HP ticks down with each matching chore, hour of work, and habit."
        - label: "Collection · Pebbles"
          icon: "🪨"
          outcome: "Each find adds one to the count."

  - slug: pets
    title: Pets
    icon: "🐾"
    audience_title: "Hatching and caring for pets"
    chapter: rpg_layer
    summary: "Egg + potion companions that grow through care."
    kid_voice: |
      Hatch a pet with an egg and a potion. Feed it to help it grow, and
      choose an active pet to keep you company.
    mechanics:
      - "Hatching consumes one egg item and one potion item and creates a unique species/potion pet."
      - "The potion must match the species' supported variants; an unsupported pairing consumes neither ingredient."
      - "Feeding consumes food; preferred food grants more growth than neutral food."
      - "At 100 growth the pet evolves into a mount while the original pet remains in your collection."
      - "Happiness is a gentle visual nudge based on last feeding; it never removes rewards or progress."
      - "Direct growth consumables are capped per pet per local day, while tonic-boosted feeding is limited by food items."
    parent_knobs:
      settings: []
      powers_badges:
        - pets_hatched
        - pet_species_owned
        - full_potion_shelf
      content_sources:
        - "Pet species and potion types are YAML-authored; item definitions reference them by typed foreign keys."
    economy:
      money: false
      coins: false
      xp: false
      drops: false
      quest_progress: false
      streak_credit: false
    trial_template: sequence
    trial:
      prompt: "Hatch a pet, feed it, and help it grow into a mount."
      payoff: "Egg → Pet → Mount"
      steps:
        - "Combine an egg and a potion to hatch a unique pet."
        - "Feed preferred food to climb growth fastest."
        - "At growth 100 the pet evolves; the original stays in your collection."

  - slug: mounts
    title: Mounts
    icon: "🐉"
    audience_title: "Pet evolution"
    chapter: rpg_layer
    summary: "Fully grown pets evolve, ride, and breed on cooldown."
    kid_voice: |
      A pet creates a matching mount when it reaches full growth. You can
      choose a mount to ride, breed mounts, or send one on an expedition.
    mechanics:
      - "A pet automatically creates a matching mount when it reaches 100 growth."
      - "Only one mount can be active for a user at a time."
      - "Breeding combines two owned mounts to create a hybrid egg + potion pair, then stamps cooldowns on both parents."
      - "Breeding returns a compatible species/potion pair; a tiny chromatic upgrade chance can turn the potion Cosmic when the species supports it."
      - "Mount sprites follow the species sprite key plus '-mount', with a base-species fallback."
      - "A mount can be sent on an Expedition (2h, 4h, or 8h) once per local day. Loot is rolled when the mount leaves and stored on the row, so the payout is the same whenever you claim. Returning mounts pay coins (with Lucky Coin doubling) and a small handful of items, and route streak / challenge credit through the same game-loop trigger as everything else."
    parent_knobs:
      settings: []
      powers_badges:
        - mounts_evolved
      content_sources:
        - "Mount behavior is service-driven; mount art is runtime-authored in the sprite catalog."
    economy:
      money: false
      coins: true
      xp: false
      drops: true
      quest_progress: true
      streak_credit: true
    trial_template: observe
    trial:
      prompt: "Watch a fully-grown pet rise into its mount form."
      payoff: "A mount joins your collection."
      caption: "Mounts ride and breed on cooldown; the original pet stays."

  - slug: drops
    title: Drops
    icon: "🎁"
    audience_title: "Items you can collect"
    chapter: rpg_layer
    summary: "Random items rolled from everyday progress."
    kid_voice: |
      Some activities give you a chance to find an item, such as an egg,
      a potion, pet food, a quest scroll, a coin pouch, or a cosmetic for
      your profile. Find collected items in Inventory.
    mechanics:
      - "Drop chance depends on trigger type, with streaks and drop boosts adding to the odds."
      - "Eligible drop-table rows are weighted and can require a minimum level."
      - "Duplicate cosmetics automatically salvage to Coins instead of stacking useless copies."
      - "Some triggers are daily-capped at their source so drops cannot be farmed by delete/recreate loops."
    parent_knobs:
      settings: []
      powers_badges: []
      content_sources:
        - "Drop tables are YAML-authored in content/rpg/initial/drops.yaml and packs."
    economy:
      money: false
      coins: true
      xp: false
      drops: true
      quest_progress: false
      streak_credit: false
    trial_template: tap_and_reward
    trial:
      prompt: "Tap the chest to roll a drop."
      payoff: "Maybe an egg · maybe a potion · maybe a coin pouch"
      target_icon: "📦"
      reward_icon: "🎁"

  - slug: streaks
    title: Streaks
    icon: "🔥"
    audience_title: "Daily activity streaks"
    chapter: rpg_layer
    summary: "Daily engagement that rewards return without punishing absence harshly."
    kid_voice: |
      A streak counts consecutive days with a qualifying activity. Missing
      a day can reset the streak, but you keep the coins, XP, and items
      you already earned.
    mechanics:
      - "The first qualifying activity of a local day records activity and awards streak-scaled daily check-in Coins."
      - "Missing a day can reset the visible streak and multiplier, but it never destroys earned Coins, XP, items, badges, pets, or memories."
      - "A streak freeze consumable can protect one missed day when its expiry covers the first missed day."
      - "Perfect Day is separate: a nightly task awards bonus Coins when a child was active and completed every scheduled daily chore, with at least one daily chore scheduled."
    parent_knobs:
      settings: []
      powers_badges:
        - streak_days
        - perfect_days_count
        - streak_freeze_used
      content_sources:
        - "Game-loop triggers from work, chores, homework, habits, journal, and creations feed the streak service."
    economy:
      money: false
      coins: true
      xp: false
      drops: true
      quest_progress: false
      streak_credit: true
    trial_template: tap_and_reward
    trial:
      prompt: "Tap to mark a day of activity."
      payoff: "Longer streaks increase daily check-in coins"
      target_icon: "🔥"
      reward_icon: "🪙"

  - slug: coins
    title: Coins
    icon: "🪙"
    audience_title: "Earning and spending coins"
    chapter: trade_coin
    summary: "A non-money progression currency for rewards and boosts."
    kid_voice: |
      Earn coins through activities and spend them in the Reward Shop.
      Coins are separate from your real money balance.
    mechanics:
      - "Coins are tracked in an append-only CoinLedger separate from real money."
      - "Coins can come from tracked time, project/milestone bonuses, badges, chores, exchanges, drops/salvage, birthdays, and parent adjustments."
      - "Reward redemption deducts Coins immediately as a held debit; rejection refunds them."
      - "Money-to-Coins exchange is parent-approved and snapshots the exchange rate at request time."
    parent_knobs:
      settings:
        - key: COINS_PER_HOUR
          label: Coins per tracked hour
          value: 5
        - key: COINS_PER_DOLLAR
          label: Exchange rate
          value: 10
        - key: COINS_PER_BADGE_RARITY
          label: Badge rarity coin bonuses
          value: "common 5 → legendary 150"
      powers_badges:
        - total_coins_earned
        - coins_spent_lifetime
        - reward_redeemed
      content_sources:
        - "Rewards are parent-authored; exchange requests and redemptions are approval workflows."
    economy:
      money: false
      coins: true
      xp: false
      drops: false
      quest_progress: false
      streak_credit: false
    trial_template: drag_to_target
    trial:
      prompt: "Drag a coin into the reward."
      payoff: "Reward redeemed (mock)"
      source_icon: "🪙"
      target_icon: "🎁"
      source_count: 5

  - slug: money
    title: Money
    icon: "💵"
    audience_title: "Earnings and payments"
    chapter: trade_coin
    summary: "Real allowance-style earnings tracked apart from Coins."
    kid_voice: |
      Track the real money you earn from work, projects, and chores.
      Parents record payments and adjustments, and you can follow
      your savings goals.
    mechanics:
      - "Money lives in PaymentLedger, separate from CoinLedger."
      - "Hourly work, project bonuses, optional project rewards, milestone bonuses, chore rewards, reimbursements, payouts, adjustments, and coin exchanges have distinct entry types."
      - "Exchange approval debits money and credits Coins atomically; money is not held at request time."
      - "Parents can record payouts and adjustments; timecards preserve weekly audit history."
    parent_knobs:
      settings:
        - key: COINS_PER_DOLLAR
          label: Money-to-Coins exchange rate
          value: 10
      powers_badges:
        - total_earned
        - savings_goal_completed
      content_sources:
        - "Payment kinds and approval services write the ledger; the ledger itself is append-only."
    economy:
      money: true
      coins: true
      xp: false
      drops: false
      quest_progress: false
      streak_credit: false
    trial_template: drag_to_target
    trial:
      prompt: "Drag a dollar onto the savings goal."
      payoff: "Goal climbs toward complete."
      source_icon: "💵"
      target_icon: "🏦"
      source_count: 3

  - slug: cosmetics
    title: Cosmetics
    icon: "👑"
    audience_title: "Personalize your profile"
    chapter: self_expression
    summary: "Owned style items for frames, titles, covers, pets, and trophies."
    kid_voice: |
      Choose a title, a profile frame, app colors, or a pet accessory. You
      can also display an earned badge as your trophy. Memory Meadow is
      the starter cover; other covers can arrive as item drops. Settings
      shows the covers you own and the ones you can still collect.
    mechanics:
      - "Cosmetics are owned in inventory and equipped without being consumed."
      - "Only one item per cosmetic slot can be active at a time."
      - "Equipping a journal cover from Settings or Profile routes through the same equip endpoint — both surfaces stay in lockstep."
      - "The trophy badge slot only accepts badges the user has earned."
      - "Duplicate cosmetic drops salvage to Coins."
      - "Locked cosmetics can still appear in the catalog as goals, but they are not clickable until owned."
    parent_knobs:
      settings: []
      powers_badges:
        - cosmetic_set_owned
        - cosmetic_full_set
      content_sources:
        - "Cosmetic items are YAML-authored in item content packs; sprites are runtime-authored in the sprite catalog."
    economy:
      money: false
      coins: true
      xp: false
      drops: false
      quest_progress: false
      streak_credit: false
    trial_template: choice
    trial:
      prompt: "Choose a frame for your profile."
      payoff: "Frame equipped · the look is yours."
      choices:
        - label: "Bookworm"
          icon: "📖"
          outcome: "A modest, gold-leaf border."
        - label: "Scholar"
          icon: "🎓"
          outcome: "A study-hall ribbon and laurel."
        - label: "Hyrule"
          icon: "✨"
          outcome: "A champion's filigree."
