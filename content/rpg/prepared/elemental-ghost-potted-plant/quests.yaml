# Not registered in default packs. Activate only after accepted canonical artwork passes application checks.
quests:
- name: Ember Wisp
  description: 'Discover a Fire Ghost: finish 20 approved chores or homework assignments, project milestones,
    whole projects, eligible logged creations, or daily ten-minute reading achievements within 180 days.
    The first two creations each day count. Earn one Ghost Egg and one Fire potion.'
  icon: 🔥
  quest_type: collection
  target_value: 20
  duration_days: 180
  trigger_filter:
    allowed_triggers:
    - chore_complete
    - homework_complete
    - milestone_complete
    - project_complete
    - creation_logged
    - reading_logged
  coin_reward: 0
  xp_reward: 0
  is_repeatable: false
  is_system: true
  reward_items:
