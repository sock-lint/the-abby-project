# Pet species — each entry auto-materializes both a PetSpecies row AND an
# egg ItemDefinition (type=egg) with typed FK back to the species. Authoring
# a new pet is one entry here; the loader handles the fan-out. Every family
# uses Egg → Baby → Middle → Grown (shared/catalog/companion-lifecycle.json).
# Stage-specific assets and new acquisition still require reviewed art bindings.
#
# Schema per entry:
#   slug               (required, unique)
#   name               (required) — display name
#   icon               (optional, default "")
#   sprite_key         (optional) — bundled pixel-art sprite slug
#   description        (optional)
#   food_preference    (optional) — food slug this species prefers (+15 growth)
#   available_potions  (optional list) — potion slugs this species can hatch with;
#                       empty = all potions currently in the catalog
#   egg_name           (optional) — overrides "{name} Egg"
#   egg_icon           (optional, default "🥚")
#   egg_sprite_key     (optional, default "big-egg") — sprite for the egg item
#   egg_rarity         (optional, default "common") — acquisition tier for egg and species
#   egg_coin_value     (optional, default 3)

species:
  # Owned Cute Series woodland bird. The three licensed post-hatch forms are
  # Baby/Middle/Grown of this species; its egg is the inventory stage.
  # Fire/Ice compatibility is dormant until each exact art pair is approved.
  - slug: chick
    name: Chick
    icon: "🐤"
    sprite_key: cute-chick
    description: A friendly woodland chick that grows alongside your adventures
    food_preference: birdseed
    available_potions: [base, fire, ice]
    egg_rarity: common
    egg_coin_value: 3

  # Prepared roster: exact identities, no legacy crosswalk. Authored Fire/Ice
  # compatibility also requires each exact pair in the positive artwork policy.
  # Acquisition rarity belongs to the family, independently of Base artwork
  # or growth. Five Common, five Uncommon, three Rare, one Epic, one Legendary
  # families (including Chick) provide a collection progression.
  - slug: meshtint-bat
    name: Bat
    icon: "🐾"
    sprite_key: meshtint-bat
    description: A companion with baby, middle and grown forms
    available_potions: [base, fire, ice]
    egg_rarity: uncommon
    egg_coin_value: 3

