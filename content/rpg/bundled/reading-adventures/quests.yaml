# Count earned daily Reading Adventure receipts, never individual log entries.
# All rewards reuse supported catalog identities; no new authored Coin payouts.
quests:
  - name: Reading Companion
    description: "Complete 3 daily Reading Adventures at your own pace, with no deadline. Each Adventure needs ten newly logged reading or listening minutes in your family's day. Meet a Chick with an egg, a Base potion and two Birdseed."
    icon: "🐤"
    quest_type: collection
    target_value: 3
    duration_days: null
    trigger_filter:
      allowed_triggers: [reading_logged]
    coin_reward: 0
    xp_reward: 20
    is_system: true
    reward_items:
      - {slug: chick-egg, quantity: 1}
      - {slug: base-potion, quantity: 1}
      - {slug: food-birdseed, quantity: 2}
    skill_tags:
      - {skill: "Language Arts::Reading Comprehension", weight: 1}

  - name: Reading Routine
    description: "Complete 5 daily Reading Adventures during this seven-day window. Reading or listening for ten newly logged minutes counts once each family-local day. Earn two Birdseed to care for your companion; a new window follows every seven days."
    icon: "🌾"
    quest_type: collection
    target_value: 5
    duration_days: 7
    trigger_filter:
      allowed_triggers: [reading_logged]
    coin_reward: 0
    xp_reward: 20
    is_repeatable: true
    is_system: true
    reward_items:
      - {slug: food-birdseed, quantity: 2}
    skill_tags:
      - {skill: "Language Arts::Reading Comprehension", weight: 1}

  - name: Reading Voyager
    description: "Unlock by completing Reading Companion and reaching Reading Comprehension level 1. Complete 20 daily Reading Adventures within 84 days after this challenge opens. Each Adventure needs ten newly logged reading or listening minutes and counts once each family-local day. Earn the Bookworm title."
    icon: "📚"
    quest_type: collection
    target_value: 20
    duration_days: 84
    prerequisite_quest: Reading Companion
    required_skill: "Language Arts::Reading Comprehension"
    required_skill_level: 1
    trigger_filter:
      allowed_triggers: [reading_logged]
    coin_reward: 0
    xp_reward: 50
    is_system: true
    reward_items:
      - {slug: title-bookworm, quantity: 1}
    skill_tags:
      - {skill: "Language Arts::Reading Comprehension", weight: 1}
