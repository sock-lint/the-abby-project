<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#FFF8EE">
    <title>Play — The Abby Project</title>
    <link rel="stylesheet" href="TemplateData/phone.css">
    <link rel="stylesheet" href="TemplateData/storybook.css">
  </head>
  <body>
    <main id="world" aria-label="Play">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1" aria-label="Your companion and progress"></canvas>
      <section id="welcome" class="overlay" aria-labelledby="welcome-title">
        <div class="card">
          <p class="eyebrow">The Abby Project</p>
          <h1 id="welcome-title">Play</h1>
          <p id="welcome-message">Getting your companion ready.</p>
          <progress id="progress" value="0" max="1" aria-label="Loading Play"></progress>
          <p id="load-status" role="status" aria-live="polite"></p>
          <a href="/">Back to Today</a>
        </div>
      </section>
      <section id="error" class="overlay" aria-labelledby="error-title" hidden>
        <div class="card">
          <h1 id="error-title">Let's try that again</h1>
          <p id="error-message">Your world couldn't load. Check your connection, then try again.</p>
          <button id="retry" type="button">Try again</button>
          <a href="/">Back to Today</a>
        </div>
      </section>
      <noscript><p class="no-script">Turn on JavaScript to open Play. <a href="/">Back to Today</a></p></noscript>
    </main>
    <script>
      (() => {
        const canvas = document.getElementById('unity-canvas');
        const welcome = document.getElementById('welcome');
        const progress = document.getElementById('progress');
        const status = document.getElementById('load-status');
        const error = document.getElementById('error');
        const retry = document.getElementById('retry');
        let failed = false;
        let unityConfig = null;
        let unityModule = null;

        function renderPixelRatio() {
          const ratio = window.devicePixelRatio;
          // Keep high-density artwork sharp without the cost of an uncapped
          // phone framebuffer. CSS dimensions and touch geometry stay fixed.
          return typeof ratio === 'number' && Number.isFinite(ratio)
            ? Math.min(2, Math.max(1, ratio)) : 1;
        }

        function fitViewport() {
          // The visual viewport follows browser chrome and the phone keyboard.
          const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.documentElement.style.setProperty('--viewport-height', `${height}px`);
          const ratio = renderPixelRatio();
          if (unityConfig) unityConfig.devicePixelRatio = ratio;
          // The generated loader copies config into Module. Update the live
          // value too when browser zoom, rotation or a display change resizes it.
          if (unityModule) unityModule.devicePixelRatio = ratio;
        }
        fitViewport();
        window.addEventListener('resize', fitViewport);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', fitViewport);

        function fail(message) {
          if (failed) return;
          failed = true;
          console.error('Abby world:', message);
          welcome.hidden = true;
          error.hidden = false;
          retry.focus();
        }
        retry.addEventListener('click', () => window.location.reload());
        canvas.addEventListener('webglcontextlost', () => {
          document.getElementById('error-message').textContent = 'Your phone paused this world. Try again to return to your companion.';
          fail('WebGL context lost');
        });

        const config = {
          arguments: [],
#if PROGRESSIVE_ASSET_LOADING
          primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
          secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
          dataUrl: 'Build/{{{ DATA_FILENAME }}}',
#endif
          frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
          codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
          streamingAssetsUrl: 'StreamingAssets',
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          matchWebGLToCanvasSize: true,
          devicePixelRatio: renderPixelRatio(),
          preRun: [(module) => {
            unityModule = module;
            fitViewport();
          }],
          showBanner: (message, type) => {
            if (type === 'error') fail(message);
            else console.warn('Abby world:', message);
          }
        };
        unityConfig = config;

        function loadPlay() {
          status.textContent = 'Loading Play...';
          const loader = document.createElement('script');
          loader.src = 'Build/{{{ LOADER_FILENAME }}}';
          loader.onerror = () => fail('Could not download the Unity loader');
          loader.onload = () => {
            try {
              createUnityInstance(canvas, config, (value) => {
                progress.value = value;
                status.textContent = value < 0.9 ? `Loading Play... ${Math.round(value * 100)}%` : 'Saying hello to your companion...';
              }).then((instance) => {
                unityModule = instance.Module;
                fitViewport();
                if (failed) return;
                welcome.hidden = true;
                canvas.focus();
              }).catch(fail);
            } catch (message) {
              fail(message);
            }
          };
          document.body.appendChild(loader);
        }

        if (window.location.protocol === 'file:') {
          document.getElementById('error-message').textContent = 'Open Play through The Abby Project.';
          fail('Unity Web builds must be served over HTTP or HTTPS');
        } else {
          loadPlay();
        }
      })();
    </script>
  </body>
</html>
