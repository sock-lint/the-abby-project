project:
  name: "the-abby-project"
  registry: "ghcr.io"
  registry_project: "matt-b-inc"

build:
  dockerfile: "Dockerfile"
  context: "."

test:
  enabled: false

scan:
  enabled: true
  severity_gate: "CRITICAL,HIGH"
  ignore_unfixed: true

deploy:
  app_services:
    - django
    - celery_worker
    - celery_beat
    # The MQTT listener. Single-replica by design — the X1's broker accepts
    # only about four clients and Bambu Studio, Handy and Home Assistant each
    # hold one. See apps/printing/CLAUDE.md.
    - printer_listener

  migrate:
    enabled: true
    command: "python manage.py backfill_accounts_history && python manage.py migrate --noinput"

  collectstatic:
    enabled: true
    command: "python manage.py collectstatic --noinput"

  environments:
    production:
      branch: "main"
      host: "192.168.4.67"
      user: "root"
      project_dir: "/opt/the-abby-project"
      compose_file: "docker-compose.yml"
      service: "django"
      app_port: 8000
      health_check:
        path: "/health"
        retries: 30
      notify: true

notifications:
  discord:
    enabled: true
    on_success: true
    on_failure: true
    on_rollback: true
